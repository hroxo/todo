name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Para publicar o .ipa na release "ultima".
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Escolher Xcode
        run: |
          echo "Xcodes instalados no runner:"
          ls -d /Applications/Xcode*.app
          # Só versões estáveis (Xcode_26.1.app), sem beta/RC; fica a mais recente.
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          echo "Escolhido: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # O primeiro arranque do simulador demora minutos: começa já, em paralelo com o resto.
      - name: Arrancar o simulador
        continue-on-error: true
        run: scripts/capturas-ci.sh arrancar

      - name: Testes do núcleo
        working-directory: Packages/ToDoCore
        run: swift test

      - name: Gerar projeto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar sem assinatura
        run: |
          xcodebuild build \
            -project ToDo.xcodeproj \
            -scheme ToDo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Empacotar .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ToDo.app Payload/
          zip -qry ToDo.ipa Payload
          ls -lh ToDo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ToDo-ipa
          path: ToDo.ipa
          retention-days: 14

      # Link fixo para descarregar no iPhone e abrir com o SideStore.
      - name: Publicar na release "ultima"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima ToDo.ipa \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Última compilação" \
            --notes "Compilado a partir de ${GITHUB_SHA::7}."

      # Capturas de ecrã no simulador, em modo de demonstração (scripts/capturas.sh descarrega-as).
      # Não bloqueiam o .ipa, que já foi publicado acima.
      - name: Compilar para o simulador
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project ToDo.xcodeproj \
            -scheme ToDo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|\*\* BUILD"

      - name: Capturas de ecrã
        id: capturas
        continue-on-error: true
        run: scripts/capturas-ci.sh build-sim/Build/Products/Debug-iphonesimulator/ToDo.app capturas

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('capturas/**/*.png') != ''
        with:
          name: capturas
          path: capturas
          retention-days: 14
