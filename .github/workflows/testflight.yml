name: TestFlight

# Assina e envia para o TestFlight com a conta Apple Developer paga (docs/CONTA-DEVELOPER.md).
# Só corre à mão até os secrets existirem; o CI normal (ci.yml) continua a gerar o .ipa sem
# assinatura para o iloader.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Confirmar os secrets
        run: |
          for nome in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!nome}" ]; then
              echo "Falta o secret $nome (docs/CONTA-DEVELOPER.md, passo 3)."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Escolher Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Testes do núcleo
        working-directory: Packages/ToDoCore
        run: swift test

      - name: Chave da App Store Connect
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/chave"
          CHAVE="$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8"
          # Aceita o .p8 tal como é ou em base64.
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$ASC_KEY_P8" > "$CHAVE.bruta" ;;
            *) echo "$ASC_KEY_P8" | base64 --decode > "$CHAVE.bruta" ;;
          esac
          # Reescreve em PEM normal: o xcodebuild é mais exigente do que o openssl.
          if ! openssl pkey -in "$CHAVE.bruta" -out "$CHAVE" 2>/dev/null; then
            echo "::error::O secret ASC_KEY_P8 não é uma chave válida (docs/CONTA-DEVELOPER.md, passo 3)."
            exit 1
          fi
          rm "$CHAVE.bruta"
          chmod 600 "$CHAVE"
          # Só o tipo da chave e a forma dos identificadores: nada de secreto vai para o registo.
          echo "Tipo da chave: $(openssl pkey -in "$CHAVE" -noout -text 2>/dev/null | grep -E 'ASN1 OID' || echo 'não é EC')"
          echo "Linhas do ficheiro: $(wc -l < "$CHAVE")"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::O secret ASC_KEY_ID não tem o formato de um Key ID (10 letras e números, sem espaços)."; exit 1; }
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error::O secret ASC_ISSUER_ID não tem o formato de um Issuer ID (um UUID, sem espaços)."; exit 1; }

      - name: Gerar projeto (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      # Assinatura automática na nuvem: com a chave (papel Admin), o Xcode cria ou reutiliza o
      # certificado de distribuição e os perfis da app e do widget.
      - name: Arquivar
        run: |
          xcodebuild archive \
            -project ToDo.xcodeproj \
            -scheme ToDo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ToDo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Exportar e enviar para o TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ToDo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/chave/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Só nomes e grupos: mostra o que os perfis da Apple trazem quando a assinatura falha.
      - name: Diagnóstico dos perfis
        if: failure()
        run: |
          for perfil in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/* "$HOME/Library/MobileDevice/Provisioning Profiles"/*; do
            [ -f "$perfil" ] || continue
            security cms -D -i "$perfil" > "$RUNNER_TEMP/perfil.plist" 2>/dev/null || continue
            nome=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/perfil.plist")
            criado=$(/usr/libexec/PlistBuddy -c 'Print :CreationDate' "$RUNNER_TEMP/perfil.plist")
            grupos=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/perfil.plist" 2>/dev/null | tr -s ' \n' ' ')
            echo "PERFIL: $nome | criado: $criado | grupos: ${grupos:-nenhum}"
          done
          rm -f "$RUNNER_TEMP/perfil.plist"

      - name: Limpar a chave
        if: always()
        run: rm -rf "$RUNNER_TEMP/chave"
